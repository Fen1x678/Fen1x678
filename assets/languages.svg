<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 195" width="350" height="195">
  <style>
    .title { font: 600 18px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #A78BFA; }
    .label { font: 400 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #C9D1D9; }
    .value { font: 700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
    .small { font: 400 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #8B949E; }
    .big { font: 800 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
    .row { animation: fadeIn .6s ease-out both; }
    .ring { animation: draw 1.4s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes draw { from { stroke-dashoffset: 301.6; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .row, .ring { animation: none; } }
  </style>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B2E"/>
      <stop offset="1" stop-color="#14152A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="1" stop-color="#3178C6"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="349" height="194" rx="12" fill="url(#cardBg)" stroke="#7F52FF" stroke-opacity=".35"/>
  <text class="title" x="25" y="38">Most used languages</text>
  <clipPath id="bar"><rect x="25" y="56" width="300" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)"><rect x="25.00" y="56" width="98.88" height="10" fill="#3178c6"/><rect x="123.38" y="56" width="87.25" height="10" fill="#dea584"/><rect x="210.13" y="56" width="48.80" height="10" fill="#F05138"/><rect x="258.44" y="56" width="34.69" height="10" fill="#663399"/><rect x="292.63" y="56" width="17.65" height="10" fill="#f1e05a"/><rect x="309.77" y="56" width="15.73" height="10" fill="#3572A5"/></g>
  <g class="row" style="animation-delay: 0.12s"><circle cx="30" cy="95" r="5" fill="#3178c6"/><text class="label" x="41" y="100">TypeScript</text><text class="small" x="41" y="115">32.8%</text></g>
  <g class="row" style="animation-delay: 0.24s"><circle cx="185" cy="95" r="5" fill="#dea584"/><text class="label" x="196" y="100">Rust</text><text class="small" x="196" y="115">28.9%</text></g>
  <g class="row" style="animation-delay: 0.36s"><circle cx="30" cy="127" r="5" fill="#F05138"/><text class="label" x="41" y="132">Swift</text><text class="small" x="41" y="147">16.1%</text></g>
  <g class="row" style="animation-delay: 0.48s"><circle cx="185" cy="127" r="5" fill="#663399"/><text class="label" x="196" y="132">CSS</text><text class="small" x="196" y="147">11.4%</text></g>
  <g class="row" style="animation-delay: 0.60s"><circle cx="30" cy="159" r="5" fill="#f1e05a"/><text class="label" x="41" y="164">JavaScript</text><text class="small" x="41" y="179">5.7%</text></g>
  <g class="row" style="animation-delay: 0.72s"><circle cx="185" cy="159" r="5" fill="#3572A5"/><text class="label" x="196" y="164">Python</text><text class="small" x="196" y="179">5.1%</text></g>
</svg>
